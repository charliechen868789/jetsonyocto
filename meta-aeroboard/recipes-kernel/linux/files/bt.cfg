# Bluetooth core
CONFIG_BT=y
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y

# USB Bluetooth transport (CRITICAL for Intel 8265)
CONFIG_BT_USB=y
CONFIG_BT_HCIBTUSB=y

# Optional but useful
CONFIG_BT_RFCOMM=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y

CONFIG_BT_HCIUART_INTEL=y
CONFIG_BT_HCIUART=y
CONFIG_BT_INTEL=y
CONFIG_BT_HCIVHCI=y
CONFIG_IWLWIFI=m
CONFIG_IWLDVM=m
CONFIG_IWLMVM=m
CONFIG_IWLWIFI_OPMODE_MODULAR=y
CONFIG_FW_LOADER=y
CONFIG_BT_HCIBTUSB_BCM=n
CONFIG_BT_HCIUSB=y
CONFIG_FIRMWARE_IN_KERNEL=y